<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1080" height="1350" fill="#F3F1EC"/>

  <text x="80" y="120" font-size="26" fill="#6B6B6B" letter-spacing="2">DESIGNER BUILD SCOUT · 18 NOV 2026</text>

  <text x="80" y="230" font-size="72" font-weight="700" fill="#2B2B2B">Designers' first agents</text>
  <text x="80" y="315" font-size="72" font-weight="700" fill="#2B2B2B">are mostly words</text>

  <rect x="80" y="370" width="920" height="170" rx="28" fill="#FBF3D9"/>
  <text x="120" y="440" font-size="36" fill="#2B2B2B">Designers building agents mostly <tspan font-weight="700">write</tspan>:</text>
  <text x="120" y="495" font-size="36" fill="#2B2B2B">rules, roles and judgement, in plain language.</text>

  <rect x="80" y="580" width="920" height="170" rx="28" fill="#EDF1F8"/>
  <text x="120" y="645" font-size="30" font-weight="700" fill="#2B2B2B">What</text>
  <text x="120" y="695" font-size="30" fill="#3A3A3A">A design assistant made of markdown files. Five small</text>
  <text x="120" y="735" font-size="30" fill="#3A3A3A">agents, each with one job.</text>

  <rect x="80" y="780" width="920" height="170" rx="28" fill="#EDF1F8"/>
  <text x="120" y="845" font-size="30" font-weight="700" fill="#2B2B2B">Who</text>
  <text x="120" y="895" font-size="30" fill="#3A3A3A">Dianne Alter, Head of Design, The Design Project.</text>
  <text x="120" y="935" font-size="30" fill="#3A3A3A">Stefan Imhoff, design engineer.</text>

  <rect x="80" y="980" width="920" height="170" rx="28" fill="#E6F2EA"/>
  <text x="120" y="1045" font-size="30" font-weight="700" fill="#2B2B2B">Why it matters</text>
  <text x="120" y="1095" font-size="30" fill="#3A3A3A">Writing intent is a design skill. And almost nobody</text>
  <text x="120" y="1135" font-size="30" fill="#3A3A3A">documents these builds visually yet.</text>

  <text x="80" y="1210" font-size="22" fill="#6B6B6B">Sources: designproject.io/blog/ai-design-assistant</text>
  <text x="80" y="1242" font-size="22" fill="#6B6B6B">stefanimhoff.de/writing/guide-to-agentic-coding</text>
  <text x="80" y="1274" font-size="22" fill="#6B6B6B">Finds verified from their own posts · "almost nobody visually" is my framing</text>
  <text x="80" y="1310" font-size="22" font-weight="700" fill="#2B2B2B">Pedro Rosas · @aiPedroRosas</text>
</svg>
