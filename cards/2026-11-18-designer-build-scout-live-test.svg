<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1080" height="1350" fill="#F3F1EC"/>

  <text x="80" y="110" font-size="26" fill="#6B6B6B" letter-spacing="2">DESIGNER BUILD SCOUT · 18 NOV 2026</text>
  <text x="80" y="210" font-size="72" font-weight="700" fill="#2B2B2B">A design team</text>
  <text x="80" y="292" font-size="72" font-weight="700" fill="#2B2B2B">made of agents</text>

  <rect x="80" y="350" width="920" height="550" rx="32" fill="#FFFFFF" opacity="0.6"/>

  <!-- Brief -->
  <rect x="115" y="440" width="150" height="190" rx="16" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="2"/>
  <rect x="140" y="475" width="100" height="12" rx="6" fill="#C9D3E3"/>
  <rect x="140" y="505" width="80" height="12" rx="6" fill="#C9D3E3"/>
  <rect x="140" y="535" width="95" height="12" rx="6" fill="#C9D3E3"/>
  <rect x="140" y="565" width="65" height="12" rx="6" fill="#C9D3E3"/>
  <text x="190" y="672" font-size="28" font-weight="700" fill="#2B2B2B" text-anchor="middle">The brief</text>

  <line x1="280" y1="535" x2="320" y2="535" stroke="#8A8A8A" stroke-width="5" stroke-linecap="round"/>
  <polygon points="320,521 344,535 320,549" fill="#8A8A8A"/>

  <!-- Agent team -->
  <rect x="360" y="400" width="400" height="290" rx="24" fill="#EDF1F8" stroke="#C9D3E3" stroke-width="2"/>
  <rect x="385" y="425" width="170" height="46" rx="14" fill="#E6F2EA"/>
  <text x="470" y="456" font-size="21" fill="#2B2B2B" text-anchor="middle">strategist</text>
  <rect x="565" y="425" width="170" height="46" rx="14" fill="#E6F2EA"/>
  <text x="650" y="456" font-size="21" fill="#2B2B2B" text-anchor="middle">design lead</text>
  <rect x="385" y="483" width="170" height="46" rx="14" fill="#E6F2EA"/>
  <text x="470" y="514" font-size="21" fill="#2B2B2B" text-anchor="middle">writer</text>
  <rect x="565" y="483" width="170" height="46" rx="14" fill="#E6F2EA"/>
  <text x="650" y="514" font-size="21" fill="#2B2B2B" text-anchor="middle">builder</text>
  <rect x="385" y="541" width="170" height="46" rx="14" fill="#E6F2EA"/>
  <text x="470" y="572" font-size="21" fill="#2B2B2B" text-anchor="middle">accessibility</text>
  <rect x="565" y="541" width="170" height="46" rx="14" fill="#E6F2EA"/>
  <text x="650" y="572" font-size="21" fill="#2B2B2B" text-anchor="middle">critic</text>
  <rect x="385" y="605" width="350" height="62" rx="14" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="2"/>
  <text x="560" y="644" font-size="22" font-weight="700" fill="#2B2B2B" text-anchor="middle">one shared design state</text>
  <text x="560" y="732" font-size="28" font-weight="700" fill="#2B2B2B" text-anchor="middle">10 agents hand off</text>

  <line x1="775" y1="535" x2="805" y2="535" stroke="#8A8A8A" stroke-width="5" stroke-linecap="round"/>
  <polygon points="805,521 829,535 805,549" fill="#8A8A8A"/>

  <!-- Human -->
  <circle cx="900" cy="535" r="70" fill="#FBF3D9" stroke="#E8D9A6" stroke-width="3"/>
  <text x="900" y="546" font-size="32" font-weight="700" fill="#2B2B2B" text-anchor="middle">you</text>
  <text x="900" y="652" font-size="28" font-weight="700" fill="#2B2B2B" text-anchor="middle">Creative</text>
  <text x="900" y="688" font-size="28" font-weight="700" fill="#2B2B2B" text-anchor="middle">director</text>

  <!-- Modes -->
  <rect x="115" y="780" width="420" height="80" rx="20" fill="#EDF1F8"/>
  <text x="325" y="830" font-size="25" fill="#2B2B2B" text-anchor="middle"><tspan font-weight="700">Direct:</tspan> pause every handoff</text>
  <rect x="555" y="780" width="410" height="80" rx="20" fill="#E6F2EA"/>
  <text x="760" y="830" font-size="25" fill="#2B2B2B" text-anchor="middle"><tspan font-weight="700">Auto:</tspan> stop on disagreement</text>

  <rect x="80" y="935" width="920" height="150" rx="28" fill="#FBF3D9"/>
  <text x="540" y="1000" font-size="38" fill="#2B2B2B" text-anchor="middle">Agents check the work.</text>
  <text x="540" y="1053" font-size="38" fill="#2B2B2B" text-anchor="middle"><tspan font-weight="700">Taste</tspan> stays with the designer.</text>

  <text x="80" y="1140" font-size="28" fill="#3A3A3A"><tspan font-weight="700">Built by:</tspan> MC Dean (Designpowers, open source)</text>

  <text x="80" y="1200" font-size="21" fill="#6B6B6B">Sources: marieclairedean.substack.com/p/i-built-a-design-team-out-of-ai-agents</text>
  <text x="80" y="1230" font-size="21" fill="#6B6B6B">conffab.com (Web Directions summary) · github.com/Owl-Listener/designpowers</text>
  <text x="80" y="1260" font-size="21" fill="#6B6B6B">Build verified from her post · "partly autonomous" label is my framing</text>
  <text x="80" y="1310" font-size="22" font-weight="700" fill="#2B2B2B">Pedro Rosas · @aiPedroRosas</text>
</svg>
